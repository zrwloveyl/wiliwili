name: Build custom wiliwili GLES3 Flatpak

on:
  workflow_dispatch:

jobs:
  build-gles3-flatpak:
    name: Build GLES3 Flatpak aarch64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fix git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Patch manifest for GLES3
        run: |
          echo "===== Before patch ====="
          grep -n 'USE_GLES' .flatpak-manifest.yml || true

          python3 - <<'PY'
          from pathlib import Path

          p = Path(".flatpak-manifest.yml")
          lines = p.read_text().splitlines()

          out = []
          inserted = False

          for line in lines:
              out.append(line)
              if "- -DUSE_GLES2=OFF" in line and not inserted:
                  indent = line[:len(line) - len(line.lstrip())]
                  out.append(indent + "- -DUSE_GLES3=ON")
                  inserted = True

          if not inserted:
              raise SystemExit("ERROR: Cannot find -DUSE_GLES2=OFF in manifest")

          p.write_text("\n".join(out) + "\n")
          PY

          echo "===== After patch ====="
          grep -n 'USE_GLES' .flatpak-manifest.yml || true

      - name: Generate gamepad mappings
        run: |
          BRLS_GLFW="library/borealis/library/lib/extern/glfw/"
          cmake -P "${BRLS_GLFW}/CMake/GenerateMappings.cmake" \
            "${BRLS_GLFW}/src/mappings.h.in" \
            "${BRLS_GLFW}/src/mappings.h"

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6.7
        with:
          bundle: wiliwili-gles3-aarch64.flatpak
          manifest-path: .flatpak-manifest.yml
          cache-key: flatpak-builder-gles3-${{ hashFiles('.flatpak-manifest.yml') }}
          arch: aarch64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiliwili-gles3-aarch64
          path: wiliwili-gles3-aarch64.flatpak
          if-no-files-found: error
