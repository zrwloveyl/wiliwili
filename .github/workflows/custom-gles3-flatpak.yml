name: Build custom wiliwili GLES3 Flatpak

on:
  workflow_dispatch:

jobs:
  build-gles3-flatpak:
    name: build custom GLES3 Flatpak aarch64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fix git safe directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Show source version
        run: |
          set -eux
          uname -a
          dpkg --print-architecture || true
          git rev-parse HEAD
          git describe --tags --always || true

      - name: Install build tools
        run: |
          set -eux
          sudo apt update
          sudo apt install -y \
            flatpak flatpak-builder \
            cmake ninja-build pkg-config python3 \
            git git-lfs curl ca-certificates \
            xz-utils unzip

          flatpak --version
          flatpak-builder --version

      - name: Install Flatpak runtime and SDK
        run: |
          set -eux
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Platform.GL.default//25.08 \
            org.freedesktop.Platform.GL.default//25.08-extra
          flatpak list --runtime --columns=application,branch,arch,origin,installation,version

      - name: Patch manifest to GLES3 safely
        run: |
          set -eux

          echo "===== before patch ====="
          grep -nE 'USE_GLES|USE_EGL|MPV_NO_FB|PLATFORM_DESKTOP|runtime-version' .flatpak-manifest.yml || true

          python3 - <<'PY'
          from pathlib import Path

          p = Path(".flatpak-manifest.yml")
          lines = p.read_text().splitlines()

          out = []
          inserted = False

          for line in lines:
              out.append(line)
              if "- -DUSE_GLES2=OFF" in line and not inserted:
                  indent = line[:len(line) - len(line.lstrip())]
                  out.append(indent + "- -DUSE_GLES3=ON")
                  inserted = True

          if not inserted:
              raise SystemExit("Cannot find -DUSE_GLES2=OFF")

          p.write_text("\n".join(out) + "\n")
          PY

          echo "===== after patch ====="
          grep -nE 'USE_GLES|USE_EGL|MPV_NO_FB|PLATFORM_DESKTOP|runtime-version' .flatpak-manifest.yml || true

          echo "===== manifest around GLES flags ====="
          nl -ba .flatpak-manifest.yml | sed -n '145,180p'

      - name: Generate gamepad mappings
        run: |
          set -eux
          BRLS_GLFW="library/borealis/library/lib/extern/glfw/"
          cmake -P "${BRLS_GLFW}/CMake/GenerateMappings.cmake" \
            "${BRLS_GLFW}/src/mappings.h.in" \
            "${BRLS_GLFW}/src/mappings.h"

      - name: Build Flatpak bundle
        run: |
          set -eux
          rm -rf build-dir repo

          flatpak-builder \
            --force-clean \
            --ccache \
            --repo=repo \
            --arch=aarch64 \
            build-dir \
            .flatpak-manifest.yml

          flatpak build-bundle \
            --arch=aarch64 \
            repo \
            wiliwili-custom-gles3-aarch64.flatpak \
            cn.xfangfang.wiliwili \
            master

          ls -lh wiliwili-custom-gles3-aarch64.flatpak
          sha256sum wiliwili-custom-gles3-aarch64.flatpak

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiliwili-custom-gles3-aarch64
          path: wiliwili-custom-gles3-aarch64.flatpak
          if-no-files-found: error
